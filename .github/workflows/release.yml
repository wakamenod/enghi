name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # cgo prevents cross-compilation (enforced by require_cgo.go), so build
    # natively on a runner matching the target OS and architecture.
    #
    # To add linux/arm64, add an entry with runs-on: ubuntu-24.04-arm
    # (arm64 runners are free for public repositories).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-latest   # Apple Silicon
            goos: darwin
            goarch: arm64
          - runs-on: macos-13       # Intel
            goos: darwin
            goarch: amd64
          - runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe requires tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: make build

      - name: inspect the binary
        run: |
          ./bin/enghi version
          # Verify the architecture to catch runner mismatches
          test "$(go env GOARCH)" = "${{ matrix.goarch }}"
          test "$(go env GOOS)" = "${{ matrix.goos }}"

      - name: package
        run: |
          name="enghi_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/$name"
          cp bin/enghi README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: enghi_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The Homebrew formula needs SHA-256 checksums, so always publish them.
      - name: checksums
        run: cd dist && sha256sum *.tar.gz | tee SHA256SUMS

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes dist/*.tar.gz dist/SHA256SUMS
