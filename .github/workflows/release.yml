name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # cgo rules out building across operating systems, so each OS gets its own
    # runner. Architecture is different: on macOS, clang can target x86_64 from
    # Apple Silicon, so one runner covers both Macs. That matters because the
    # Intel macos-13 runner has been retired and never leaves the queue.
    #
    # To add linux/arm64, add an entry with runs-on: ubuntu-24.04-arm
    # (arm64 runners are free for public repositories).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-latest
            goos: darwin
            goarch: arm64
            cgo_flags: "-O2 -g"
            arch_check: arm64
            native: true
          - runs-on: macos-latest
            goos: darwin
            goarch: amd64
            cgo_flags: "-O2 -g -arch x86_64"
            arch_check: x86_64
            native: false
          - runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo_flags: "-O2 -g"
            arch_check: x86-64
            native: true
    runs-on: ${{ matrix.runs-on }}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_CFLAGS: ${{ matrix.cgo_flags }}
      CGO_LDFLAGS: ${{ matrix.cgo_flags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe requires tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: make build

      - name: inspect the binary
        run: |
          # Inspect the binary itself. Asking the toolchain would only echo the
          # environment set above, which proves nothing about what was produced.
          file bin/enghi
          file bin/enghi | grep -q '${{ matrix.arch_check }}'

      - name: run it
        if: ${{ matrix.native }}
        run: ./bin/enghi version

      - name: package
        run: |
          name="enghi_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/$name"
          cp bin/enghi README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: enghi_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The Homebrew formula needs SHA-256 checksums, so always publish them.
      - name: checksums
        run: cd dist && sha256sum *.tar.gz | tee SHA256SUMS

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes dist/*.tar.gz dist/SHA256SUMS
