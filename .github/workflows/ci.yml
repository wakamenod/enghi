name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # cgo prevents cross-compilation, so run natively on a runner per OS.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: make vet
      - run: make test

      # Verify that the build guards still trigger. If they stop working,
      # a binary without FTS5 or a cgo-less stub could silently slip into a release.
      - name: build guards reject bad builds
        run: |
          if go build -o /dev/null ./cmd/enghi 2>/dev/null; then
            echo "a build without the tag succeeded (require_fts5.go is not working)"; exit 1
          fi
          if CGO_ENABLED=0 go build -tags sqlite_fts5 -o /dev/null ./cmd/enghi 2>/dev/null; then
            echo "a CGO_ENABLED=0 build succeeded (require_cgo.go is not working)"; exit 1
          fi
