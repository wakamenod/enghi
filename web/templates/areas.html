{{template "head" .}}
{{$d := .Data}}
<h1>{{t "area.title"}}</h1>
<div class="meta">{{t "area.note"}}</div>

{{if $d.Areas}}
<ul class="rows">
  {{range $d.Areas}}
  <li><a href="/gtd/area/{{.ID}}">{{.Name}}</a>
      {{if .Description}}<span class="meta">{{.Description}}</span>{{end}}</li>
  {{end}}
</ul>
{{else}}<div class="empty">{{t "area.none"}}</div>{{end}}

<section class="panel">
  <h2>{{t "common.add"}}</h2>
  <form method="post" action="/ui/areas">
    <input type="hidden" name="return_to" value="/gtd/areas">
    <label for="name">{{t "area.name"}}</label>
    <input type="text" id="name" name="name" placeholder="{{t "area.name_example"}}" required>
    <label for="description">{{t "area.description"}}</label>
    <input type="text" id="description" name="description">
    <div class="actions"><button type="submit" class="primary">{{t "common.create"}}</button></div>
  </form>
</section>
{{template "foot" .}}
