{{template "head" .}}
{{$d := .Data}}
<h1>Areas of Responsibility</h1>
<div class="meta">維持し続ける責任範囲。完了しない。</div>

{{if $d.Areas}}
<ul class="rows">
  {{range $d.Areas}}
  <li><a href="/gtd/area/{{.ID}}">{{.Name}}</a>
      {{if .Description}}<span class="meta">{{.Description}}</span>{{end}}</li>
  {{end}}
</ul>
{{else}}<div class="empty">まだありません</div>{{end}}

<section class="panel">
  <h2>追加</h2>
  <form method="post" action="/ui/areas">
    <input type="hidden" name="return_to" value="/gtd/areas">
    <label for="name">名前</label>
    <input type="text" id="name" name="name" placeholder="経理 / 健康 / チームの採用" required>
    <label for="description">説明</label>
    <input type="text" id="description" name="description">
    <div class="actions"><button type="submit" class="primary">作る</button></div>
  </form>
</section>
{{template "foot" .}}
