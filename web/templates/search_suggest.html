{{range .Results}}
<a href="{{if eq .Kind "page"}}/wiki/{{.Slug}}{{else}}/search?q={{$.Query}}{{end}}">
  <div class="t"><span class="badge {{.Kind}}">{{kindLabel .Kind}}</span> {{.Title}}</div>
  {{if .Snippet}}<div class="s">{{snippet .Snippet}}</div>{{end}}
</a>
{{end}}
{{if .Results}}<a href="/search?q={{.Query}}"><div class="s">{{t "search.all_results"}}</div></a>{{end}}
