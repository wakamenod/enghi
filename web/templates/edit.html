{{template "head" .}}
{{$d := .Data}}
<h1>{{if $d.IsNew}}{{t "edit.new"}}{{else}}{{t "edit.editing" $d.Page.Title}}{{end}}</h1>

<form method="post" action="{{if $d.IsNew}}/ui/pages{{else}}/ui/pages/{{$d.Page.Slug}}{{end}}">
  {{if not $d.IsNew}}<input type="hidden" name="version" value="{{$d.Page.Version}}">{{end}}

  <label for="title">{{t "edit.title"}}</label>
  <input type="text" id="title" name="title" value="{{$d.Page.Title}}" required autofocus>

  <label for="tags">{{t "edit.tags"}}</label>
  <input type="text" id="tags" name="tags" value="{{$d.TagText}}">

  <label for="body">{{t "edit.body" "[[...]]"}}</label>
  <textarea id="body" name="body" spellcheck="false">{{$d.Page.Body}}</textarea>

  <div class="actions">
    <button type="submit" class="primary">{{t "common.save"}}</button>
    <button type="button" id="preview-toggle">{{t "edit.preview"}}</button>
    <span class="spacer"></span>
    {{if not $d.IsNew}}<a class="btn" href="/wiki/{{$d.Page.Slug}}">{{t "common.cancel"}}</a>
    {{else}}<a class="btn" href="/wiki">{{t "common.cancel"}}</a>{{end}}
  </div>
</form>

<div id="preview" class="prose preview-pane"></div>
{{template "foot" .}}
