{{template "head" .}}
{{$d := .Data}}
<h1>記事一覧 <span class="count">{{$d.Total}}</span></h1>
<div class="meta">
  並び:
  <a href="/wiki?sort=updated">更新順</a> ·
  <a href="/wiki?sort=created">作成順</a> ·
  <a href="/wiki?sort=title">タイトル順</a>
  · <span class="kbd">j</span><span class="kbd">k</span> で移動 <span class="kbd">Enter</span> で開く
</div>

{{if $d.Pages}}
<ul class="rows">
{{range $d.Pages}}
  <li>
    <a href="/wiki/{{.Slug}}">{{.Title}}</a>
    {{range .Tags}}<a class="tag" href="/tags/{{.}}">{{.}}</a>{{end}}
    <span class="when">{{shortTime .UpdatedAt}}</span>
  </li>
{{end}}
</ul>
{{else}}
<div class="empty">まだ記事がありません。<a href="/wiki/new">最初の1件を書く</a></div>
{{end}}

<div class="actions"><a class="btn" href="/wiki/new">新しい記事</a></div>
{{template "foot" .}}
