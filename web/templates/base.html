{{define "head"}}<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — enghi</title>
<script>
// 描画前にテーマを当てる(後から当てると一瞬もとの配色が見える)
(function () {
  try {
    var t = localStorage.getItem("enghi-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body data-strings='{{.Strings}}'>
<header class="top">
  <div class="inner">
    <a class="brand{{if eq .Nav "dashboard"}} on{{end}}" href="/">enghi</a>
    <nav class="main">
      <a href="/wiki"  class="{{if eq .Nav "wiki"}}on{{end}}">{{t "nav.articles"}}</a>
      <a href="/tags"  class="{{if eq .Nav "tags"}}on{{end}}">{{t "nav.tags"}}</a>
      <a href="/gtd"   class="{{if eq .Nav "gtd"}}on{{end}}">{{t "nav.gtd"}}</a>
    </nav>
    <div class="searchbox">
      <form action="/search" method="get" autocomplete="off">
        <input type="text" id="q" name="q" value="{{.Query}}" placeholder="{{t "search.placeholder"}}"
               hx-get="/ui/search" hx-trigger="keyup changed delay:100ms"
               hx-target="#suggest" hx-swap="innerHTML">
      </form>
      <div class="suggest" id="suggest"></div>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle"
            title="{{t "theme.toggle"}}" aria-label="{{t "theme.toggle"}}"></button>
    <div class="lang-switch" title="{{t "lang.switch"}}">
      {{range langs}}{{if ne (printf "%s" .) $.LangCode}}<a href="/ui/lang?set={{.}}&return_to={{$.Path}}">{{. | langName}}</a>{{end}}{{end}}
    </div>
  </div>
</header>
<main class="wrap">
{{if .Err}}<div class="notice">{{.Err}}</div>{{end}}
{{if .Flash}}<div class="notice">{{.Flash}}</div>{{end}}
{{end}}

{{define "foot"}}
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
{{end}}
